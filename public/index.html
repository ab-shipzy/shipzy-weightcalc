<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#00304a">
<title>ShipzyCart Weight Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0074ff; --navy:#00304a; --mint:#43edd4;
  --bg:#f4f7fa; --card:#ffffff; --border:#e3e9f0;
  --text:#0f2333; --muted:#61758a; --danger:#e5484d;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column;
  min-height:100vh; min-height:100dvh;
}
.mono{font-family:'JetBrains Mono',monospace;}

/* header */
header{
  background:var(--navy); color:#fff;
  padding:14px 16px 12px;
  position:sticky; top:0; z-index:20;
}
.brandrow{display:flex; align-items:center; gap:10px;}
.smark{
  width:32px;height:32px;border-radius:8px;
  background:var(--blue); color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px; flex-shrink:0;
}
.brandrow h1{font-size:16px;font-weight:700;letter-spacing:.2px;}
.brandrow small{display:block;font-size:11px;font-weight:500;color:var(--mint);letter-spacing:.4px;}

/* mode tabs */
.tabs{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
  margin-top:12px;
}
.tab{
  border:1px solid rgba(255,255,255,.25); background:transparent; color:#cfe0ec;
  border-radius:10px; padding:8px 4px; text-align:center; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:12.5px; line-height:1.25;
  transition:all .15s;
}
.tab span{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:#8fa8ba;margin-top:2px;}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.tab.active span{color:var(--mint);}

/* unit selector */
.unitrow{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px; background:var(--card); border-bottom:1px solid var(--border);
}
.unitrow label{font-size:12px;font-weight:600;color:var(--muted);}
.units{display:flex;gap:6px;flex:1;}
.unit{
  flex:1; border:1px solid var(--border); background:#fff; color:var(--muted);
  border-radius:8px; padding:7px 0; text-align:center; cursor:pointer;
  font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500;
}
.unit.active{background:var(--navy);border-color:var(--navy);color:var(--mint);font-weight:700;}

/* main */
main{flex:1; padding:14px 14px 190px; max-width:560px; width:100%; margin:0 auto;}

.boxcard{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px; margin-bottom:12px; position:relative;
}
.boxhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.boxtitle{font-size:13px;font-weight:700;}
.boxtitle em{font-style:normal;color:var(--blue);}
.delbtn{
  border:none;background:transparent;color:var(--danger);cursor:pointer;
  font-size:12px;font-weight:600;font-family:inherit;padding:4px 6px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.field label{
  display:block;font-size:10.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;
}
.field input{
  width:100%; border:1px solid var(--border); border-radius:9px;
  padding:10px 8px; font-family:'JetBrains Mono',monospace; font-size:15px;
  color:var(--text); background:#fbfcfe; outline:none; text-align:center;
}
.field input:focus{border-color:var(--blue); background:#fff;}
.boxstat{
  margin-top:10px; padding-top:9px; border-top:1px dashed var(--border);
  display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted);
}
.boxstat b{color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:700;}

.addbtn{
  width:100%; border:2px dashed #b9c8d6; background:transparent; color:var(--blue);
  border-radius:14px; padding:13px; cursor:pointer;
  font-family:inherit; font-weight:700; font-size:14px;
}
.addbtn:active{background:#e9f2ff;}

/* result bar */
.resultbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--navy); color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,48,74,.25);
}
.resinner{max-width:560px;margin:0 auto;}
.resgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:10px;}
.resitem{display:flex;justify-content:space-between;font-size:12px;color:#9fb6c6;}
.resitem b{font-family:'JetBrains Mono',monospace;color:#fff;font-weight:500;}
.chargeable{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,116,255,.18); border:1px solid var(--blue);
  border-radius:12px; padding:10px 14px;
}
.chargeable .lbl{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mint);}
.chargeable .lbl small{display:block;font-size:10px;font-weight:500;color:#9fb6c6;text-transform:none;letter-spacing:0;}
.chargeable .val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:#fff;}
.chargeable .val small{font-size:13px;font-weight:500;color:var(--mint);}
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <div class="smark">S</div>
    <div>
      <h1>Weight Calculator</h1>
      <small>SHIPZYCART · VOLUMETRIC</small>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-mode="cft10">10 CFT<span>÷ 2700</span></button>
    <button class="tab" data-mode="cft6">6 CFT<span>÷ 4500</span></button>
    <button class="tab" data-mode="air">Air Dom/Intl<span>÷ 5000</span></button>
  </div>
</header>

<div class="unitrow">
  <label>Dimensions in</label>
  <div class="units" id="units">
    <button class="unit active" data-unit="cm">cm</button>
    <button class="unit" data-unit="in">inch</button>
    <button class="unit" data-unit="ft">feet</button>
    <button class="unit" data-unit="m">meter</button>
  </div>
</div>

<main>
  <div id="boxes"></div>
  <button class="addbtn" id="addBox">+ Add Box Type</button>
</main>

<div class="resultbar">
  <div class="resinner">
    <div class="resgrid">
      <div class="resitem"><span>Total Boxes</span><b id="rBoxes">0</b></div>
      <div class="resitem"><span>Total Actual</span><b id="rActual">0.00 kg</b></div>
      <div class="resitem"><span>Total CBM</span><b id="rCbm">0.000</b></div>
      <div class="resitem"><span>Total Volumetric</span><b id="rVol">0.00 kg</b></div>
    </div>
    <div class="chargeable">
      <div class="lbl">Chargeable Weight<small id="rBasis">—</small></div>
      <div class="val"><span id="rCharge">0.00</span> <small>kg</small></div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var DIVISORS = { cft10: 2700, cft6: 4500, air: 5000 };
  var TO_CM = { cm: 1, in: 2.54, ft: 30.48, m: 100 };

  var state = {
    mode: 'cft10',
    unit: 'cm',
    boxes: [ newBox() ]
  };

  function newBox(){
    return { qty: 1, wt: '', l: '', w: '', h: '' };
  }

  function num(v){
    var n = parseFloat(v);
    return isFinite(n) && n > 0 ? n : 0;
  }

  function calcBox(b){
    var f = TO_CM[state.unit];
    var l = num(b.l)*f, w = num(b.w)*f, h = num(b.h)*f;
    var qty = Math.max(1, Math.round(num(b.qty)) || 1);
    var volPer = (l && w && h) ? (l*w*h) / DIVISORS[state.mode] : 0;
    var cbmPer = (l*w*h) / 1000000;
    return {
      qty: qty,
      actual: num(b.wt) * qty,
      vol: volPer * qty,
      volPer: volPer,
      cbm: cbmPer * qty
    };
  }

  function render(){
    var host = document.getElementById('boxes');
    host.innerHTML = '';
    state.boxes.forEach(function(b, i){
      var c = calcBox(b);
      var card = document.createElement('div');
      card.className = 'boxcard';
      card.innerHTML =
        '<div class="boxhead">' +
          '<div class="boxtitle">Box Type <em>' + (i+1) + '</em></div>' +
          (state.boxes.length > 1 ? '<button class="delbtn" data-del="'+i+'">Remove</button>' : '') +
        '</div>' +
        '<div class="grid2">' +
          field(i,'qty','No. of Boxes', b.qty, '1', 'numeric') +
          field(i,'wt','Actual Wt / box (kg)', b.wt, '0.0', 'decimal') +
        '</div>' +
        '<div class="grid3">' +
          field(i,'l','Length ('+state.unit+')', b.l, '0', 'decimal') +
          field(i,'w','Width ('+state.unit+')', b.w, '0', 'decimal') +
          field(i,'h','Height ('+state.unit+')', b.h, '0', 'decimal') +
        '</div>' +
        '<div class="boxstat">' +
          '<span>Vol. wt / box: <b>' + c.volPer.toFixed(2) + ' kg</b></span>' +
          '<span>Line vol: <b>' + c.vol.toFixed(2) + ' kg</b></span>' +
        '</div>';
      host.appendChild(card);
    });
    bindInputs();
    totals();
  }

  function field(i, key, label, val, ph, mode){
    return '<div class="field"><label>'+label+'</label>' +
      '<input type="text" inputmode="'+mode+'" data-i="'+i+'" data-k="'+key+'" value="'+val+'" placeholder="'+ph+'"></div>';
  }

  function bindInputs(){
    var inputs = document.querySelectorAll('#boxes input');
    for (var j=0; j<inputs.length; j++){
      inputs[j].addEventListener('input', function(e){
        var i = +e.target.getAttribute('data-i');
        var k = e.target.getAttribute('data-k');
        state.boxes[i][k] = e.target.value;
        updateStats(i);
        totals();
      });
    }
    var dels = document.querySelectorAll('#boxes .delbtn');
    for (var d=0; d<dels.length; d++){
      dels[d].addEventListener('click', function(e){
        state.boxes.splice(+e.target.getAttribute('data-del'), 1);
        render();
      });
    }
  }

  function updateStats(i){
    var cards = document.querySelectorAll('#boxes .boxcard');
    if (!cards[i]) return;
    var c = calcBox(state.boxes[i]);
    var bs = cards[i].querySelectorAll('.boxstat b');
    bs[0].textContent = c.volPer.toFixed(2) + ' kg';
    bs[1].textContent = c.vol.toFixed(2) + ' kg';
  }

  function totals(){
    var boxes=0, actual=0, vol=0, cbm=0;
    state.boxes.forEach(function(b){
      var c = calcBox(b);
      boxes += c.qty; actual += c.actual; vol += c.vol; cbm += c.cbm;
    });
    var charge = Math.max(actual, vol);
    var chargeRounded = Math.round(charge); // MROUND to 1 kg
    var basis = charge === 0 ? '—' : (vol >= actual ? 'Volumetric weight higher' : 'Actual weight higher');
    document.getElementById('rBoxes').textContent = boxes;
    document.getElementById('rActual').textContent = actual.toFixed(2) + ' kg';
    document.getElementById('rVol').textContent = vol.toFixed(2) + ' kg';
    document.getElementById('rCbm').textContent = cbm.toFixed(3);
    document.getElementById('rCharge').textContent = chargeRounded.toFixed(0);
    document.getElementById('rBasis').textContent = basis;
  }

  // tabs
  document.getElementById('tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if (!t) return;
    state.mode = t.getAttribute('data-mode');
    var tabs = document.querySelectorAll('.tab');
    for (var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
    t.classList.add('active');
    render();
  });

  // units
  document.getElementById('units').addEventListener('click', function(e){
    var u = e.target.closest('.unit');
    if (!u) return;
    state.unit = u.getAttribute('data-unit');
    var us = document.querySelectorAll('.unit');
    for (var i=0;i<us.length;i++) us[i].classList.remove('active');
    u.classList.add('active');
    render();
  });

  document.getElementById('addBox').addEventListener('click', function(){
    state.boxes.push(newBox());
    render();
    var cards = document.querySelectorAll('#boxes .boxcard');
    var last = cards[cards.length-1];
    if (last && typeof last.scrollIntoView === 'function') last.scrollIntoView({behavior:'smooth', block:'center'});
  });

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
